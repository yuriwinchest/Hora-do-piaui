services:
  # OG Server (Node.js) para renderizar meta tags
  og-server:
    image: node:18-alpine
    container_name: horapiaui-og
    restart: always
    working_dir: /app
    command: node server/og-server.mjs
    environment:
      - NODE_ENV=production
      - OG_PORT=3000
      - DIST_PATH=/app
      - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
      - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
    volumes:
      - /var/www/horapiaui:/app
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.horapiaui-og.rule=(Host(`horapiaui.com`) || Host(`www.horapiaui.com`)) && PathPrefix(`/noticia/`)"
      - "traefik.http.routers.horapiaui-og.entrypoints=websecure"
      - "traefik.http.routers.horapiaui-og.tls.certresolver=myresolver"
      - "traefik.http.routers.horapiaui-og.priority=100"
      - "traefik.http.services.horapiaui-og.loadbalancer.server.port=3000"

  # Frontend (Nginx) para servir arquivos estáticos
  frontend:
    image: nginx:alpine
    container_name: horapiaui-frontend
    restart: always
    volumes:
      - /var/www/horapiaui:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.horapiaui-frontend.rule=Host(`horapiaui.com`) || Host(`www.horapiaui.com`)"
      - "traefik.http.routers.horapiaui-frontend.entrypoints=websecure"
      - "traefik.http.routers.horapiaui-frontend.tls.certresolver=myresolver"
      - "traefik.http.services.horapiaui-frontend.loadbalancer.server.port=80"

networks:
  web:
    external: true
