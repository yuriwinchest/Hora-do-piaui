# HTTP
server {
    listen 80;
    server_name horapiaui.com www.horapiaui.com;
    root /var/www/horapiaui;
    index index.html;

    location /noticia/ {
        proxy_pass <OG_UPSTREAM>;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
        proxy_intercept_errors on;
        error_page 502 503 504 = @noticia_fallback;
    }
    location @noticia_fallback {
        try_files /index.html =404;
    }

    # Admin API (ex.: criação de usuários via painel). Roda no mesmo servidor do OG.
    location /api/ {
        proxy_pass <OG_UPSTREAM>;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }
}

# HTTPS (WhatsApp/Facebook usam HTTPS; proxy /noticia/ para og-server)
server {
    listen 443 ssl;
    server_name horapiaui.com www.horapiaui.com;
    ssl_certificate /etc/letsencrypt/live/horapiaui.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/horapiaui.com/privkey.pem;

    root /var/www/horapiaui;
