  <!-- Estilo crítico inline - evita FOUC e layout forçado antes do CSS -->

    html, body { margin: 0; padding: 0; }
    body { background-color: #fff; color: #1a1a1a; font-family: system-ui, -apple-system, 'Segoe UI', 'Inter', sans-serif; }
    #root { min-height: 100vh; }
    .min-h-screen, [class*="min-h-screen"] { min-height: 100vh; }
    .flex { display: flex; }
    .justify-center { justify-content: center; }
    .items-center { align-items: center; }
    .animate-spin, [class*="animate-spin"] { animation: hp-spin 1s linear infinite; }
    .rounded-full { border-radius: 9999px; }
    @keyframes hp-spin { to { transform: rotate(360deg); } }
  </style>
  <script>
    window.addEventListener('error',function(e){if(e.message&&(e.message.indexOf('cookie')!==-1||e.message.indexOf('__cf_bm')!==-1||e.message.indexOf('domain')!==-1)){e.preventDefault();e.stopPropagation();return true;}},true);
