<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hora do Piauí</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Merriweather:ital,wght@0,300;0,400;0,700;0,900;1,400&display=swap"
    rel="stylesheet">
  <link rel="icon" type="image/png" href="/favicon.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            serif: ['Merriweather', 'serif'],
          },
          colors: {
            primary: '#16a34a', // Green-600
          }
        }
      }
    }
  </script>
  <style>
    .news-content img {
      max-width: 100%;
      height: auto;
      border-radius: 0.75rem;
      margin: 2rem 0;
    }

    .news-content h1,
    .news-content h2,
    .news-content h3 {
      font-family: 'Merriweather', serif;
      font-weight: 700;
      margin: 2rem 0 1rem;
      color: #111;
    }

    .news-content p {
      margin-bottom: 1.5rem;
    }

    .news-content ul,
    .news-content ol {
      margin-bottom: 1.5rem;
      padding-left: 1.5rem;
    }

    .news-content li {
      margin-bottom: 0.5rem;
    }

    .news-content blockquote {
      border-left: 4px solid #16a34a;
      padding-left: 1.5rem;
      font-style: italic;
      color: #444;
      margin: 2rem 0;
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>

<body class="bg-white text-gray-900 antialiased">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
